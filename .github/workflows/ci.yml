name: ci

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main, develop]

jobs:
  quality:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: 10badv
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: 10badv/package-lock.json

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm run test:unit

      - name: Build
        run: npm run build

  integration:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: 10badv_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=20
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=5s
          --health-timeout=3s
          --health-retries=20
    defaults:
      run:
        working-directory: 10badv
    env:
      DATABASE_HOST: 127.0.0.1
      DATABASE_PORT: 3306
      DATABASE_USER: root
      DATABASE_PASSWORD: root
      DATABASE_NAME: 10badv_test
      NEXTAUTH_SECRET: ci-test-secret
      NEXTAUTH_URL: http://localhost:3000
      NODE_ENV: test
      TEST_REDIS_URL: redis://127.0.0.1:6379
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: 10badv/package-lock.json

      - name: Install
        run: npm ci

      - name: Integration tests
        run: npm run test:integration

  # 운영 DB 인 TiDB 에서도 같은 통합 테스트가 통과하는지 확인한다 (잠금·트랜잭션 동작 차이 검증).
  integration-tidb:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: 10badv
    env:
      DATABASE_HOST: 127.0.0.1
      DATABASE_PORT: 4000
      DATABASE_USER: root
      DATABASE_PASSWORD: ''
      DATABASE_NAME: tenbadv_test
      NEXTAUTH_SECRET: ci-test-secret
      NEXTAUTH_URL: http://localhost:3000
      NODE_ENV: test
      TEST_REDIS_URL: redis://127.0.0.1:6379
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Start TiDB
        run: |
          docker run -d --name tidb -p 4000:4000 pingcap/tidb:v8.5.0
          docker run -d --name redis -p 6379:6379 redis:7-alpine
          for i in $(seq 1 30); do
            mysql -h 127.0.0.1 -P 4000 -u root -e 'SELECT 1' >/dev/null 2>&1 && break
            sleep 2
          done
          mysql -h 127.0.0.1 -P 4000 -u root -e 'CREATE DATABASE IF NOT EXISTS tenbadv_test; SELECT tidb_version()\G'

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: 10badv/package-lock.json

      - name: Install
        run: npm ci

      - name: Integration tests
        run: npm run test:integration

  # 운영 이미지가 빌드되고, MySQL 과 함께 실제로 떠서 응답하는지 확인한다.
  docker-smoke:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: 10badv
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Write env file
        run: |
          cat > .env.local <<ENV
          NEXTAUTH_SECRET=ci-smoke-secret
          NEXTAUTH_URL=http://localhost:3000
          CRON_SECRET=ci-smoke-cron
          SETTLEMENT_INTERVAL_MINUTES=1
          ENV

      - name: Build and start
        run: docker compose up -d --build

      - name: Wait for health
        run: |
          for i in $(seq 1 40); do
            if curl -fsS http://localhost:3000/api/health; then echo; exit 0; fi
            sleep 3
          done
          docker compose logs app
          exit 1

      - name: Check schema and settlement endpoint
        run: |
          # 서버 시작 시 스키마 초기화로 에스크로 컬럼이 생겼는지
          docker compose exec -T db sh -c 'mysql -u root -p"$MYSQL_ROOT_PASSWORD" "$MYSQL_DATABASE" -N -e "SHOW COLUMNS FROM transactions LIKE \"escrow_status\""' | grep escrow_status
          # 자동정산 API 가 비밀값으로 호출되는지, 없으면 거부하는지
          curl -fsS -X POST -H "Authorization: Bearer ci-smoke-cron" http://localhost:3000/api/cron/settle | grep '"success":true'
          test "$(curl -s -o /dev/null -w '%{http_code}' -X POST http://localhost:3000/api/cron/settle)" = "401"
          docker compose logs app | grep '자동정산 스케줄러 시작'

      - name: Logs on failure
        if: failure()
        run: docker compose logs
