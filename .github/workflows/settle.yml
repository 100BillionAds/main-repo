name: settle

# 에스크로 자동정산 호출 (1시간마다)
# Render 무료 플랜은 15분간 요청이 없으면 서버가 잠들어 내장 스케줄러가 멈춘다.
# 이 작업이 정산 API 를 호출해 서버를 깨우고 기한이 지난 거래를 처리한다.
#
# 필요한 설정 (Settings → Secrets and variables → Actions)
#   Variable: APP_URL      예) https://tenbadv.onrender.com
#   Secret  : CRON_SECRET  Render 서비스의 CRON_SECRET 과 같은 값
#
# 참고: 예약 작업은 기본 브랜치(main)에서만 돈다.

on:
  schedule:
    - cron: '7 * * * *'
  workflow_dispatch:

concurrency:
  group: settle
  cancel-in-progress: false

jobs:
  settle:
    if: ${{ vars.APP_URL != '' }}
    runs-on: ubuntu-latest
    # 90초 × 4회 + 대기 20초 × 3회 = 7분. 이보다 짧으면 잠든 서버를 기다리다 작업이 취소된다.
    timeout-minutes: 9
    steps:
      - name: Call settlement API
        id: settle
        env:
          APP_URL: ${{ vars.APP_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          # 비밀값이 아직 등록되지 않았으면 호출하지 않고 경고만 남긴다.
          # 실패로 끝내면 매시간 실패 메일이 가므로 성공으로 끝낸다.
          # 이때 정산은 서버가 깨어 있는 동안 내장 스케줄러(server.js)가 처리한다.
          if [ -z "${CRON_SECRET}" ]; then
            echo "::warning::저장소 Secret CRON_SECRET 이 없어 호출을 건너뜁니다. 등록 방법: docs/DEPLOYMENT.md 0-3"
            echo "skipped=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # 잠든 서버가 깨어나는 데 1분 가까이 걸리므로 넉넉히 기다리며 재시도한다
          for i in 1 2 3 4; do
            body=$(curl -sS --max-time 90 -X POST \
              -H "Authorization: Bearer ${CRON_SECRET}" \
              -w '\n%{http_code}' "${APP_URL}/api/cron/settle") || true
            code=$(echo "$body" | tail -n1)
            echo "attempt $i: HTTP $code"
            echo "$body" | head -n -1
            if [ "$code" = "200" ]; then
              echo "$body" | head -n -1 | grep -q '"failed":0' || { echo "::warning::정산 실패 건이 있습니다"; }
              exit 0
            fi
            if [ "$code" = "401" ] || [ "$code" = "403" ]; then
              echo "::error::인증 실패. GitHub Secret CRON_SECRET 과 Render 의 CRON_SECRET 값이 같은지 확인하세요"
              exit 1
            fi
            [ "$i" = 4 ] || sleep 20
          done
          echo "::error::자동정산 호출 실패"
          exit 1

      # 오래된 처리 완료 이벤트·읽은 알림을 지운다. 실패해도 정산 결과에는 영향을 주지 않는다.
      - name: Call maintenance API
        if: ${{ steps.settle.outputs.skipped != 'true' }}
        continue-on-error: true
        env:
          APP_URL: ${{ vars.APP_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          curl -sS --max-time 60 -X POST -H "Authorization: Bearer ${CRON_SECRET}" "${APP_URL}/api/cron/maintenance"
