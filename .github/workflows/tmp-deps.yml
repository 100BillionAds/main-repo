# 임시: 잠금 파일 갱신용. 이 브랜치에서만 쓰고 PR 전에 삭제한다.
name: tmp-deps
on:
  push:
    branches: [chore/react-19.3.1]
    paths: ['.github/workflows/tmp-deps.yml']
permissions:
  contents: write
jobs:
  bump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '20'
      - working-directory: 10badv
        run: npm install --package-lock-only --ignore-scripts --save-exact react@19.3.1 react-dom@19.3.1
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add 10badv/package.json 10badv/package-lock.json
          git commit -m "chore(deps): react, react-dom 19.3.1 로 함께 올림"
          git push
