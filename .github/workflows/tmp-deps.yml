# 임시: 잠금 파일 갱신용. 이 브랜치에서만 쓰고 PR 전에 삭제한다.
name: tmp-deps
on:
  push:
    branches: [chore/deps-update]
    paths: ['.github/workflows/tmp-deps.yml']
permissions:
  contents: write
jobs:
  bump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '20'
      - working-directory: 10badv
        run: |
          npm install --package-lock-only --ignore-scripts \
            @aws-sdk/client-s3@3.1037.0 mysql2@3.22.2 @portone/browser-sdk@0.1.5 \
            next-auth@4.24.14 next@16.2.4 dotenv@17.4.2
          npm install --package-lock-only --ignore-scripts -D \
            eslint-config-next@16.2.4 tailwindcss@4.2.4 @tailwindcss/postcss@4.2.4
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add 10badv/package.json 10badv/package-lock.json
          git commit -m "chore(deps): 의존성 업데이트 (minor/patch)"
          git push
