version: 2
updates:
  - package-ecosystem: 'npm'
    directory: '/10badv'
    schedule:
      interval: 'weekly'
    open-pull-requests-limit: 10
    labels:
      - 'dependencies'
      - 'automated'
    groups:
      # react 와 react-dom 은 버전이 정확히 같아야 한다. 따로 올리면 테스트가 깨진다(#76).
      react:
        patterns:
          - 'react'
          - 'react-dom'
