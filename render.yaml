# Render Blueprint: 백억광고 앱 (무료 플랜)
# DB 는 TiDB Cloud Starter(MySQL 호환, 무료)를 쓴다. 접속 정보는 대시보드에서 입력한다.
# 자세한 절차: docs/DEPLOYMENT.md 0장
services:
  - type: web
    name: tenbadv
    runtime: docker
    plan: free
    region: singapore
    branch: main
    rootDir: 10badv
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /api/health
    # GitHub CI 가 통과한 커밋만 배포한다
    autoDeployTrigger: checksPass
    envVars:
      # ---- DB (TiDB Cloud Starter) ----
      - key: DATABASE_URL
        sync: false
      - key: DATABASE_SSL
        value: "true"
      # ---- 인증 ----
      - key: NEXTAUTH_SECRET
        generateValue: true
      # NEXTAUTH_URL 은 비워 두면 Render 가 주는 RENDER_EXTERNAL_URL 을 쓴다 (server.js)
      # ---- 에스크로 자동정산 ----
      - key: CRON_SECRET
        generateValue: true
      - key: SETTLEMENT_INTERVAL_MINUTES
        value: "10"
      - key: ESCROW_AUTO_CONFIRM_DAYS
        value: "7"
      - key: ESCROW_AUTO_CANCEL_DAYS
        value: "7"
      - key: ESCROW_COMMISSION_RATE
        value: "0.1"
      # ---- 결제 (포트원, 선택) ----
      # 아래 값들은 브라우저에 노출되는 공개 값입니다 (빌드 시점에 포함됨).
      # 현재는 포트원 '테스트' 채널(카카오페이)이라 실제 결제가 일어나지 않습니다.
      # (KG이니시스 테스트 채널은 V1 전용이라 V2 SDK에서 거절됨)
      # 실연동 전환 시 실연동 채널 키/결제수단으로 교체하세요.
      - key: NEXT_PUBLIC_PORTONE_STORE_ID
        value: store-4f5ddcf1-3d8c-40cd-98f7-f62dc20f0fa7
      - key: NEXT_PUBLIC_PORTONE_CHANNEL_KEY
        value: channel-key-19bf94b9-c6a4-427f-9a4a-6359402d65b2
      - key: NEXT_PUBLIC_PORTONE_PAY_METHOD
        value: EASY_PAY
      - key: PORTONE_API_SECRET
        sync: false
      # ---- Redis (캐시, 요청 제한) ----
      # 아래 tenbadv-cache 의 내부 접속 주소가 자동으로 들어간다. 없으면 앱은 메모리 저장소로 동작한다.
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: tenbadv-cache
          property: connectionString
      # ---- AI (LLM) ----
      # mock: 실제 AI 를 부르지 않고 예시 문구를 돌려준다 (비용 0).
      # 실제로 쓰려면 Render 대시보드에서 LLM_PROVIDER 를 anthropic 으로 바꾸고 ANTHROPIC_API_KEY 를 넣는다.
      - key: LLM_PROVIDER
        value: mock
      - key: LLM_DAILY_LIMIT_PER_USER
        value: "20"
      - key: ANTHROPIC_API_KEY
        sync: false
      # ---- 파일 업로드 (Cloudinary, 선택) ----
      - key: STORAGE_PROVIDER
        value: cloudinary
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false

  # Redis 호환 저장소 (무료 플랜: 재시작하면 데이터가 사라진다 — 캐시·요청 제한 용도라 괜찮다)
  - type: keyvalue
    name: tenbadv-cache
    plan: free
    region: singapore
    # 메모리가 차도 키를 임의로 지우지 않는다. 작업 큐(BullMQ)의 키가 일부만 지워지면 큐가 깨지기 때문이다.
    # 캐시 키는 모두 만료 시간이 있어 스스로 사라지고, 가득 차서 쓰기가 실패하면 캐시는 그냥 건너뛴다.
    maxmemoryPolicy: noeviction
    # 외부 접속 차단: Render 내부 네트워크(같은 리전의 내 서비스)에서만 접속한다
    ipAllowList: []
