# 로컬 개발/검증용: 앱 + MySQL 을 한 번에 띄운다.
#   cp .env.example .env.local   (값 수정)
#   docker compose up --build
#
# 앱 컨테이너는 compose 네트워크의 `db` 로 접속하므로 DATABASE_HOST 는 여기서 덮어쓴다.
# DATABASE_USER 는 root 가 아닌 값이어야 한다 (MySQL 이미지 제약). 기본값 app.

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "3000:3000"
    env_file:
      - .env.local
    environment:
      NODE_ENV: production
      DATABASE_URL: ""
      DATABASE_HOST: db
      DATABASE_PORT: 3306
      DATABASE_USER: ${DATABASE_USER:-app}
      DATABASE_PASSWORD: ${DATABASE_PASSWORD:-app-local-password}
      DATABASE_NAME: ${DATABASE_NAME:-tenbadv}
      DATABASE_SSL: "false"
      REDIS_URL: redis://redis:6379
    restart: unless-stopped

  db:
    image: mysql:8.0
    restart: unless-stopped
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_unicode_ci"]
    ports:
      - "127.0.0.1:3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root-local-password}
      MYSQL_DATABASE: ${DATABASE_NAME:-tenbadv}
      MYSQL_USER: ${DATABASE_USER:-app}
      MYSQL_PASSWORD: ${DATABASE_PASSWORD:-app-local-password}
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 10s
      timeout: 5s
      retries: 20

  # 캐시·요청 제한용. 데이터를 디스크에 남기지 않는다 (운영의 무료 Redis 와 같은 조건).
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--save", "", "--appendonly", "no", "--maxmemory", "64mb", "--maxmemory-policy", "noeviction"]

volumes:
  mysql_data:
